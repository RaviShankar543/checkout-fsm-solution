[project]
name = "fsm-assistant"
version = "0.1.0"
description = "POC: GenAI assistant for Fraud Success Managers (NL -> SQL -> rule)"
requires-python = ">=3.11,<3.14"
dependencies = [    
    "anthropic>=2.3",    
    "streamlit>=1.40",    
    "pandas>=2.2",    
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]